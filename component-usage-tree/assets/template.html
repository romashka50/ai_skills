<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<style>
:root {
  color-scheme: light;
  --bg: #fbfaf7; --surface: #ffffff; --surface2: #eef0f4; --ink: #1b2230; --muted: #5d687a;
  --line: #d5d9e1; --line-strong: #9aa4b5; --accent: #3557c4; --accent-soft: #e3ebfc;
  --mod: #7a5200; --mod-soft: #fbf0d9; --add: #116b32; --add-soft: #def3e7;
  --del: #a3271f; --del-soft: #fbe3e3; --hi: #a3271f; --med: #7a5200; --low: #4a6fa5;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #15171b; --surface: #1a1f28; --surface2: #232a36; --ink: #e6e9ef; --muted: #98a2b3;
    --line: #313a49; --line-strong: #5b677c; --accent: #8aa6ff; --accent-soft: #1f2d4d;
    --mod: #f0c674; --mod-soft: #3a2f16; --add: #7fd99b; --add-soft: #14301f;
    --del: #ff9a92; --del-soft: #3b1a1a; --hi: #ff9a92; --med: #f0c674; --low: #8fb0e6;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #15171b; --surface: #1a1f28; --surface2: #232a36; --ink: #e6e9ef; --muted: #98a2b3;
  --line: #313a49; --line-strong: #5b677c; --accent: #8aa6ff; --accent-soft: #1f2d4d;
  --mod: #f0c674; --mod-soft: #3a2f16; --add: #7fd99b; --add-soft: #14301f;
  --del: #ff9a92; --del-soft: #3b1a1a; --hi: #ff9a92; --med: #f0c674; --low: #8fb0e6;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--surface); z-index: 10; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
header h1 { font-size: 16px; margin: 0; font-weight: 650; }
header .range { font-family: var(--mono); font-size: 12px; color: var(--muted); }
header .stats { display: flex; gap: 14px; margin-left: auto; font-size: 13px; color: var(--muted); }
header .stats b { color: var(--ink); font-weight: 650; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; min-height: calc(100vh - 56px); }
.stage { min-width: 0; display: flex; flex-direction: column; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 4px 10px; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.toolbar label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
.toolbar input[type=search] { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 4px 8px; font: inherit; width: 170px; }
.legend { margin-left: auto; display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
.legend .grp { font-weight: 650; color: var(--ink); flex-basis: 100%; margin-top: 2px; }
.legend i.line { width: 24px; height: 0; border: 0; border-top: 1.5px solid var(--line-strong); border-radius: 0; vertical-align: 3px; }
.legend i.line.dash { border-top-style: dashed; }
.legend i.line.hot { border-top: 2.5px solid var(--accent); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; border: 1.5px solid; }
.canvas { overflow: auto; padding: 8px; flex: 1; }
svg { display: block; }
.colhead { font-size: 11px; fill: var(--muted); }
.node { cursor: pointer; }
.node rect.box { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1; }
.node.consumer rect.box { stroke: var(--line); }
.node.dependency rect.box { stroke-dasharray: 4 3; stroke: var(--line); fill: var(--surface2); }
.node.changed.modified rect.box { stroke: var(--mod); fill: var(--mod-soft); }
.node.changed.added rect.box { stroke: var(--add); fill: var(--add-soft); }
.node.changed.renamed rect.box { stroke: var(--accent); fill: var(--accent-soft); }
.node.changed.deleted rect.box { stroke: var(--del); fill: var(--del-soft); stroke-dasharray: 5 3; }
.node.changed rect.box { stroke-width: 1.6; }
.node .name { font-size: 13px; font-weight: 600; fill: var(--ink); }
.node.deleted .name { text-decoration: line-through; }
.node .sub { font-size: 11px; fill: var(--muted); }
.node.sel rect.box { stroke: var(--accent); stroke-width: 3; }
.node.ring rect.box { stroke: var(--hi); stroke-width: 3; }
.node:focus-visible rect.box { stroke: var(--accent); stroke-width: 3; }
.dim { opacity: 0.16; }
.edge { fill: none; stroke: var(--line-strong); stroke-width: 1.2; }
.edge.re { stroke-dasharray: 5 4; }
.edge.hot { stroke: var(--accent); stroke-width: 2.2; }
.edge.dim { opacity: 0.08; }
.edgelabel { font-size: 11px; fill: var(--accent); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
.m-arrow { fill: var(--line-strong); } .m-arrow-hot { fill: var(--accent); }
aside { background: var(--surface); border-left: 1px solid var(--line); padding: 16px; overflow: auto; max-height: calc(100vh - 56px); position: sticky; top: 56px; }
aside h2 { font-size: 15px; margin: 0 0 2px; word-break: break-all; }
aside h3 { font-size: 12px; margin: 18px 0 6px; color: var(--muted); font-weight: 650; letter-spacing: .02em; }
.path { font: 12px var(--mono); color: var(--muted); word-break: break-all; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 0; }
.chip { font: 12px var(--mono); padding: 1px 7px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--line); }
.chip.mod { background: var(--mod-soft); color: var(--mod); border-color: transparent; }
.chip.add { background: var(--add-soft); color: var(--add); border-color: transparent; }
.chip.del { background: var(--del-soft); color: var(--del); border-color: transparent; }
.chip.miss { background: var(--del-soft); color: var(--del); border-color: transparent; font-weight: 600; }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-align: left; font: 13px var(--mono); text-decoration: underline; text-underline-offset: 2px; word-break: break-all; }
.issue { border: 1px solid var(--line); border-left-width: 4px; border-radius: 6px; padding: 8px 10px; margin: 0 0 8px; background: var(--bg); }
.issue.high { border-left-color: var(--hi); } .issue.medium { border-left-color: var(--med); } .issue.low { border-left-color: var(--low); }
.issue .t { font-weight: 600; } .issue .d { color: var(--muted); font-size: 13px; margin-top: 2px; }
.issue .sev { font-size: 11px; font-weight: 700; margin-right: 6px; }
.issue.high .sev { color: var(--hi); } .issue.medium .sev { color: var(--med); } .issue.low .sev { color: var(--low); }
.issue .rel { margin-top: 6px; display: flex; flex-direction: column; gap: 2px; }
.issue button.pick { all: unset; cursor: pointer; display: block; width: 100%; }
.use { border-top: 1px solid var(--line); padding: 8px 0; }
.use .via { font-size: 12px; color: var(--muted); }
.site { margin: 6px 0 0 0; padding: 6px 8px; background: var(--bg); border-radius: 6px; border: 1px solid var(--line); }
.site .row { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.lnum { font: 12px var(--mono); color: var(--muted); }
.kind { font-size: 11px; font-weight: 700; color: var(--accent); }
.snip { font: 12px var(--mono); color: var(--muted); margin-top: 3px; white-space: pre-wrap; word-break: break-all; }
.empty { color: var(--muted); font-size: 13px; }
.hint { color: var(--muted); font-size: 13px; margin: 6px 0 14px; }
.summary { background: var(--accent-soft); border-radius: 6px; padding: 8px 10px; margin: 8px 0 14px; font-size: 13px; }
textarea { width: 100%; height: 180px; font: 12px var(--mono); background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
details summary { cursor: pointer; color: var(--accent); font-size: 13px; }
.note { color: var(--muted); font-size: 12px; margin-top: 16px; }

/* Before / after / why, copied from the visualisation walkthrough */
.guide details.file { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); overflow: hidden; }
.guide details.file > summary { padding: 8px 10px; font: 600 12px var(--mono); word-break: break-all; color: var(--ink); }
.guide .file-role, .guide .problem-solution { padding: 0 10px 8px; margin: 0; color: var(--muted); font-size: 13px; }
.guide .problem-solution b { text-transform: uppercase; font-size: 11px; letter-spacing: .05em; }
.guide .hunk { border-top: 1px solid var(--line); }
.guide .hunk-head { padding: 4px 10px; font: 11px var(--mono); color: var(--muted); background: var(--surface2); }
.guide .ln { display: grid; grid-template-columns: 34px 16px minmax(0, 1fr); border-top: 1px solid var(--line); }
.guide .ln .num { text-align: right; padding: 2px 4px; font: 11px var(--mono); color: var(--muted); }
.guide .ln .sign { text-align: center; padding: 2px 0; font: 700 12px var(--mono); }
.guide .ln pre { margin: 0; padding: 2px 6px; font: 12px var(--mono); white-space: pre-wrap; word-break: break-word; }
.guide .ln .note { grid-column: 1 / -1; padding: 4px 10px; font-size: 13px; background: var(--surface2); border-left: 3px solid var(--accent); color: var(--ink); margin: 0; }
.guide .ln.add { background: var(--add-soft); } .guide .ln.add .sign { color: var(--add); }
.guide .ln.del { background: var(--del-soft); } .guide .ln.del .sign { color: var(--del); }
.guide .ln.ctx pre { color: var(--muted); }
.guide .why { font-weight: 600; }
.guide .meta { color: var(--muted); font-weight: 400; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  aside { position: static; max-height: none; border-left: 0; border-top: 1px solid var(--line); }
  header .stats { margin-left: 0; }
  .legend { margin-left: 0; }
}
@media (prefers-reduced-motion: no-preference) { .edge, .node { transition: opacity .12s; } }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <span class="range" id="range"></span>
  <span class="stats" id="stats"></span>
</header>
<div class="layout">
  <div class="stage">
    <div class="toolbar">
      <span class="seg" role="group" aria-label="Link scope">
        <button id="scope-direct" aria-pressed="true">Direct links</button>
        <button id="scope-chain" aria-pressed="false">Full chain</button>
      </span>
      <label><input type="checkbox" id="opt-tests" checked> Tests</label>
      <label><input type="checkbox" id="opt-deps" checked> Dependencies</label>
      <input type="search" id="q" placeholder="Filter by name" aria-label="Filter by name">
      <span class="legend" id="legend"></span>
    </div>
    <div class="canvas" id="canvas"><svg id="svg" role="group" aria-label="Component usage graph"></svg></div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</div>
<script id="graph-data" type="application/json">__GRAPH_JSON__</script>
<script>
(function () {
  var G = JSON.parse(document.getElementById('graph-data').textContent);
  var byId = {}; G.nodes.forEach(function (n) { byId[n.id] = n; });
  var state = { sel: null, scope: 'direct', tests: true, deps: true, q: '', riskFocus: null };
  var NW = 216, NH = 46, GX = 120, GY = 14, PAD = 20, HEAD = 30;
  var SVGNS = 'http://www.w3.org/2000/svg';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function short(s, n) { return s.length <= n ? s : s.slice(0, Math.ceil(n * 0.55)) + '…' + s.slice(-Math.floor(n * 0.4)); }
  function risksFor(id) { return G.risks.filter(function (r) { return r.nodeId === id; }); }
  function risksTouching(id) { return G.risks.filter(function (r) { return r.nodeId === id || (r.related || []).indexOf(id) >= 0; }); }
  var SEV = { high: 0, medium: 1, low: 2 };
  function worst(list) { return list.reduce(function (a, r) { return a == null || SEV[r.severity] < SEV[a] ? r.severity : a; }, null); }

  // ---------- header ----------
  var m = G.meta, st = m.stats;
  document.getElementById('title').textContent = 'Change impact · ' + m.repo;
  document.getElementById('range').textContent = m.base.slice(0, 10) + ' → ' + m.head + (m.heuristic ? ' · static analysis' : '');
  document.getElementById('stats').innerHTML = '<span><b>' + st.changed + '</b> changed</span><span><b>' + st.consumers + '</b> consumers</span><span><b>' + G.risks.length + '</b> issues</span>';
  document.getElementById('legend').innerHTML =
    '<span class="grp">Boxes</span>' +
    '<span><i style="border-color:var(--mod);background:var(--mod-soft)"></i>modified</span>' +
    '<span><i style="border-color:var(--add);background:var(--add-soft)"></i>added</span>' +
    '<span title="File removed in this change"><i style="border-color:var(--del);background:var(--del-soft);border-style:dashed"></i>deleted (dashed)</span>' +
    '<span title="Unchanged file that imports a changed file"><i style="border-color:var(--line-strong);background:var(--surface)"></i>consumer</span>' +
    '<span title="Unchanged file that a changed file imports"><i style="border-color:var(--line);background:var(--surface2);border-style:dashed"></i>dependency (dashed)</span>' +
    '<span class="grp">Arrows (file → code that uses it)</span>' +
    '<span title="The file imports or uses the one the arrow starts from"><i class="line"></i>import / use</span>' +
    '<span title="Reached through a barrel (index) file that re-exports it"><i class="line dash"></i>re-export (dashed)</span>' +
    '<span title="Links of the selected file; the label says how many times it is used"><i class="line hot"></i>selected file\'s links</span>';

  // ---------- visibility + layout ----------
  function visible(n) {
    if (!state.tests && n.kind === 'test') return false;
    if (!state.deps && n.role === 'dependency') return false;
    return true;
  }
  function visEdges(vis) { return G.edges.filter(function (e) { return vis[e.from] && vis[e.to]; }); }

  function layout() {
    var vis = {}; G.nodes.forEach(function (n) { if (visible(n)) vis[n.id] = n; });
    var edges = visEdges(vis);
    var layers = {};
    Object.keys(vis).forEach(function (id) { (layers[vis[id].layer] = layers[vis[id].layer] || []).push(vis[id]); });
    var keys = Object.keys(layers).map(Number).sort(function (a, b) { return a - b; });
    var pos = {};
    var order = keys.slice().sort(function (a, b) { return Math.abs(a) - Math.abs(b) || b - a; });
    order.forEach(function (L) {
      var col = layers[L];
      col.forEach(function (n) {
        var ys = [];
        edges.forEach(function (e) {
          var other = e.from === n.id ? e.to : e.to === n.id ? e.from : null;
          if (other && pos[other] && vis[other].layer !== L) ys.push(pos[other].y);
        });
        n._bary = ys.length ? ys.reduce(function (a, b) { return a + b; }, 0) / ys.length : 1e9;
      });
      col.sort(function (a, b) { return a._bary - b._bary || a.id.localeCompare(b.id); });
      col.forEach(function (n, i) { pos[n.id] = { y: HEAD + i * (NH + GY), L: L }; });
    });
    var tallest = Math.max.apply(null, keys.map(function (L) { return layers[L].length; }));
    var H = HEAD + tallest * (NH + GY) + PAD;
    keys.forEach(function (L, ci) {
      var colH = layers[L].length * (NH + GY);
      var off = Math.max(0, ((tallest * (NH + GY)) - colH) / 2);
      layers[L].forEach(function (n) { pos[n.id].y += off; pos[n.id].x = PAD + ci * (NW + GX); });
    });
    return { vis: vis, edges: edges, pos: pos, keys: keys, W: PAD * 2 + keys.length * NW + (keys.length - 1) * GX, H: H };
  }

  // ---------- highlight sets ----------
  function neighborhood(L) {
    var set = {}, edgeSet = {};
    if (!state.sel || !L.vis[state.sel]) return null;
    set[state.sel] = 1;
    if (state.scope === 'direct') {
      L.edges.forEach(function (e, i) { if (e.from === state.sel || e.to === state.sel) { set[e.from] = set[e.to] = 1; edgeSet[i] = 1; } });
    } else {
      var up = [state.sel];
      while (up.length) { var x = up.pop(); L.edges.forEach(function (e, i) { if (e.to === x && !edgeSet[i]) { edgeSet[i] = 1; set[e.from] = 1; up.push(e.from); } }); }
      var down = [state.sel];
      while (down.length) { var y = down.pop(); L.edges.forEach(function (e, i) { if (e.from === y && !edgeSet[i]) { edgeSet[i] = 1; set[e.to] = 1; down.push(e.to); } }); }
    }
    return { nodes: set, edges: edgeSet };
  }

  // ---------- render graph ----------
  function el(name, attrs, parent) {
    var e = document.createElementNS(SVGNS, name);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    if (parent) parent.appendChild(e);
    return e;
  }
  function colTitle(L) { return L > 1 ? 'Consumers · level ' + L : L === 1 ? 'Direct consumers' : L === 0 ? 'Changed' : 'Dependencies'; }

  function drawGraph() {
    var L = layout(), svg = document.getElementById('svg');
    svg.innerHTML = '';
    svg.setAttribute('width', L.W); svg.setAttribute('height', L.H);
    svg.setAttribute('viewBox', '0 0 ' + L.W + ' ' + L.H);
    var defs = el('defs', {}, svg);
    [['arrow', 'm-arrow'], ['arrow-hot', 'm-arrow-hot']].forEach(function (a) {
      var mk = el('marker', { id: a[0], viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, defs);
      el('path', { d: 'M0,1 L9,5 L0,9 z', 'class': a[1] }, mk);
    });
    L.keys.forEach(function (k, ci) {
      var t = el('text', { x: PAD + ci * (NW + GX), y: 16, 'class': 'colhead' }, svg); t.textContent = colTitle(k);
    });
    var hood = neighborhood(L);
    var ringSet = {};
    if (state.riskFocus) { var rk = G.risks.filter(function (r) { return r.id === state.riskFocus; })[0]; if (rk) { ringSet[rk.nodeId] = 1; (rk.related || []).forEach(function (x) { ringSet[x] = 1; }); } }
    var q = state.q.trim().toLowerCase();

    L.edges.forEach(function (e, i) {
      var a = L.pos[e.to], b = L.pos[e.from], d;  // arrow: imported file -> file that uses it
      if (a.x < b.x) { var x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2, mx = (x1 + x2) / 2; d = 'M' + x1 + ',' + y1 + ' C' + mx + ',' + y1 + ' ' + mx + ',' + y2 + ' ' + x2 + ',' + y2; }
      else { var xr = Math.max(a.x, b.x) + NW, ya = a.y + NH / 2, yb = b.y + NH / 2; d = 'M' + xr + ',' + ya + ' C' + (xr + 48) + ',' + ya + ' ' + (xr + 48) + ',' + yb + ' ' + xr + ',' + yb; }
      var hot = hood && hood.edges[i];
      var cls = 'edge' + (e.via.indexOf('reexport') >= 0 ? ' re' : '') + (hot ? ' hot' : '') + (hood && !hot ? ' dim' : '');
      var p = el('path', { d: d, 'class': cls, 'marker-end': 'url(#' + (hot ? 'arrow-hot' : 'arrow') + ')' }, svg);
      var tt = el('title', {}, p); tt.textContent = e.to + ' → ' + e.from + ' (used by)' + (e.names.length ? ': ' + e.names.join(', ') : '');
      if (hot && state.scope === 'direct') {
        var lab = e.via.indexOf('reexport') >= 0 ? 're-export' : (e.totalUses ? e.totalUses + (e.totalUses === 1 ? ' use' : ' uses') : 'import only');
        var lx = a.x < b.x ? (a.x + NW + b.x) / 2 : Math.max(a.x, b.x) + NW + 36;
        var t = el('text', { x: lx, y: (a.y + b.y) / 2 + NH / 2 - 5, 'text-anchor': a.x < b.x ? 'middle' : 'start', 'class': 'edgelabel' }, svg); t.textContent = lab;
      }
    });

    L.keys.forEach(function (k) {
      G.nodes.filter(function (n) { return L.vis[n.id] && n.layer === k; }).forEach(function (n) {
        var p = L.pos[n.id];
        var dim = (hood && !hood.nodes[n.id]) || (q && n.id.toLowerCase().indexOf(q) < 0);
        var cls = 'node ' + n.role + ' ' + n.status + (state.sel === n.id ? ' sel' : '') + (ringSet[n.id] ? ' ring' : '') + (dim ? ' dim' : '');
        var g = el('g', { 'class': cls, tabindex: 0, role: 'button', 'aria-label': n.id + ', ' + n.role + (n.role === 'changed' ? ', ' + n.status : ''), transform: 'translate(' + p.x + ',' + p.y + ')', 'data-id': n.id }, svg);
        el('rect', { 'class': 'box', width: NW, height: NH, rx: 7 }, g);
        var nm = el('text', { 'class': 'name', x: 12, y: 19 }, g); nm.textContent = short(n.label, 26);
        var sub = n.kind + (n.role === 'changed' ? ' · ' + n.status + (n.added || n.removed ? ' +' + n.added + ' −' + n.removed : '') : n.role === 'consumer' ? ' · imports changed code' : ' · used by changed code');
        var sb = el('text', { 'class': 'sub', x: 12, y: 36 }, g); sb.textContent = short(sub, 36);
        var rs = risksTouching(n.id), w = worst(rs);
        if (w) { var c = el('circle', { cx: NW - 14, cy: 14, r: 5, fill: 'var(--' + (w === 'high' ? 'hi' : w === 'medium' ? 'med' : 'low') + ')' }, g); var ct = el('title', {}, c); ct.textContent = rs.length + ' issue(s), worst: ' + w; }
        var tl = el('title', {}, g); tl.textContent = n.id;
        g.addEventListener('click', function (ev) { ev.stopPropagation(); select(n.id); });
        g.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(n.id); } });
      });
    });
  }

  // ---------- panel ----------
  function nodeLink(id) { return '<button class="link" data-goto="' + esc(id) + '">' + esc(id) + '</button>'; }
  function propsChips(props, missing) {
    var out = props.map(function (p) { return '<span class="chip">' + esc(p) + '</span>'; });
    (missing || []).forEach(function (p) { out.push('<span class="chip miss">missing ' + esc(p) + '</span>'); });
    return out.join('');
  }
  function siteHtml(s, required) {
    var miss = (s.kind === 'render' && required) ? required.filter(function (r) { return s.props.indexOf(r) < 0 && s.props.indexOf('...spread') < 0; }) : [];
    return '<div class="site"><div class="row"><span class="lnum">L' + s.line + '</span><span class="kind">' + esc(s.kind) + '</span><code>' + esc(s.symbol) + '</code></div>' +
      (s.props.length || miss.length ? '<div class="chips">' + propsChips(s.props, miss) + '</div>' : '') +
      '<div class="snip">' + esc(s.snippet) + '</div></div>';
  }
  function issueHtml(r, showNode) {
    var rel = (r.related || []).map(function (x) { return '<span>' + nodeLink(x) + '</span>'; }).join('');
    return '<div class="issue ' + esc(r.severity) + '"><button class="pick" data-risk="' + esc(r.id) + '"><div class="t"><span class="sev">' + esc(r.severity.toUpperCase()) + '</span>' + esc(r.title) + (r.source === 'review' ? ' <span class="chip">review</span>' : '') + '</div>' +
      (showNode ? '<div class="path">' + esc(r.nodeId) + '</div>' : '') + '<div class="d">' + esc(r.detail) + '</div></button>' +
      (rel ? '<div class="rel">' + rel + '</div>' : '') + '</div>';
  }
  function checklist() {
    var out = ['# Review checklist — ' + m.repo, ''];
    G.risks.forEach(function (r) { out.push('- [ ] **' + r.severity + '** `' + r.nodeId + '` — ' + r.title); (r.related || []).forEach(function (x) { out.push('  - [ ] check `' + x + '`'); }); });
    if (m.likelyTests && m.likelyTests.length) { out.push('', '## Run these tests'); m.likelyTests.forEach(function (t) { out.push('- `' + t + '`'); }); }
    return out.join('\n');
  }

  function overview() {
    var h = '<h2>Overview</h2><p class="hint">Click a changed file in the graph to see what changed and why, plus every place it is used and which props or exports each consumer relies on.</p>';
    if (m.summary) h += '<div class="summary">' + esc(m.summary) + '</div>';
    h += '<h3>Issues to check (' + G.risks.length + ')</h3>';
    h += G.risks.length ? G.risks.map(function (r) { return issueHtml(r, true); }).join('') : '<p class="empty">No issues detected by the static checks. That does not prove the change is safe.</p>';
    if (m.likelyTests && m.likelyTests.length) h += '<h3>Likely tests to run</h3>' + m.likelyTests.map(function (t) { return '<div>' + nodeLink(t) + '</div>'; }).join('');
    h += '<h3>Share</h3><details><summary>Review checklist (markdown)</summary><textarea readonly aria-label="Review checklist markdown">' + esc(checklist()) + '</textarea></details>';
    h += '<p class="note">Static, regex-based analysis' + (m.depth ? ' to ' + m.depth + ' levels' : '') + '. It cannot see dynamic imports built from variables, string-based lookups, or types. Treat it as a map of where to look.</p>';
    return h;
  }

  function detail(n) {
    var h = '<h2>' + esc(n.label) + '</h2><div class="path">' + esc(n.id) + '</div><div class="chips">';
    h += '<span class="chip">' + esc(n.kind) + '</span>';
    if (n.role === 'changed') h += '<span class="chip ' + (n.status === 'added' ? 'add' : n.status === 'deleted' ? 'del' : 'mod') + '">' + esc(n.status) + '</span><span class="chip add">+' + n.added + '</span><span class="chip del">−' + n.removed + '</span>';
    else h += '<span class="chip">' + (n.role === 'consumer' ? 'consumer (unchanged)' : 'dependency (unchanged)') + '</span>';
    h += '</div>';
    if (n.renamedFrom) h += '<div class="hint">Renamed from <code>' + esc(n.renamedFrom) + '</code></div>';
    if (n.note) h += '<div class="summary">' + esc(n.note) + '</div>';
    if (n.role === 'changed') {
      h += '<h3>What changed</h3><div class="chips">';
      (n.changedSymbols || []).forEach(function (s) { h += '<span class="chip mod">' + esc(s) + '</span>'; });
      (n.addedExports || []).forEach(function (s) { h += '<span class="chip add">+ export ' + esc(s) + '</span>'; });
      (n.removedExports || []).forEach(function (s) { h += '<span class="chip del">− export ' + esc(s) + '</span>'; });
      if (n.propChanges) { n.propChanges.newlyRequired.forEach(function (s) { h += '<span class="chip miss">now required: ' + esc(s) + '</span>'; }); n.propChanges.removed.forEach(function (s) { h += '<span class="chip del">prop removed: ' + esc(s) + '</span>'; }); }
      h += '</div>';
      if (!(n.changedSymbols || []).length && !(n.addedExports || []).length && !(n.removedExports || []).length) h += '<p class="empty">No exported symbol touched, or symbols could not be matched to hunks.</p>';
    }
    if (n.role === 'changed' && (n.guide || m.hasGuide)) {
      h += '<h3>Before → after, and why</h3>';
      h += n.guide ? '<div class="guide">' + n.guide + '</div>' : '<p class="empty">No walkthrough block for this file in the guide.</p>';
      if (n.guide && window.parent !== window) h += '<p><button class="link" data-walk="' + esc(n.id) + '">Open in the full walkthrough ↓</button></p>';
    }
    var mine = risksTouching(n.id);
    h += '<h3>Issues involving this file (' + mine.length + ')</h3>';
    h += mine.length ? mine.map(function (r) { return issueHtml(r, r.nodeId !== n.id); }).join('') : '<p class="empty">None detected.</p>';

    var required = n.propChanges ? n.propChanges.newlyRequired : null;
    var direct = G.edges.filter(function (e) { return e.to === n.id; });
    var indirect = n.indirectUsages || [];
    h += '<h3>Where it is used (' + (direct.length + indirect.length) + ' files)</h3>';
    if (!direct.length && !indirect.length) h += '<p class="empty">Nothing in the analysed graph imports this file.</p>';
    direct.forEach(function (e) {
      h += '<div class="use">' + nodeLink(e.from) + '<div class="via">line ' + e.importLine + ' · ' + (e.via.indexOf('reexport') >= 0 ? 're-exports ' : 'imports ') + esc(e.names.join(', ') || '(side effect)') + (e.totalUses > e.usages.length ? ' · showing ' + e.usages.length + ' of ' + e.totalUses + ' uses' : '') + '</div>';
      h += e.usages.map(function (s) { return siteHtml(s, required); }).join('') + '</div>';
    });
    indirect.forEach(function (i) {
      h += '<div class="use">' + nodeLink(i.consumer) + '<div class="via">through barrel <code>' + esc(i.barrel) + '</code> · line ' + i.importLine + ' · ' + esc(i.names.join(', ')) + '</div>';
      h += i.usages.map(function (s) { return siteHtml(s, required); }).join('') + '</div>';
    });
    var out = G.edges.filter(function (e) { return e.from === n.id; });
    if (out.length) {
      h += '<h3>Depends on (' + out.length + ')</h3>';
      out.forEach(function (e) { h += '<div class="use">' + nodeLink(e.to) + '<div class="via">line ' + e.importLine + ' · ' + esc(e.names.join(', ') || '(side effect)') + '</div></div>'; });
    }
    if (n.tests && n.tests.length) h += '<h3>Tests that reach it</h3>' + n.tests.map(function (t) { return '<div>' + nodeLink(t) + '</div>'; }).join('');
    h += '<p><button class="link" data-clear="1">← Back to overview</button></p>';
    return h;
  }

  function drawPanel() {
    var p = document.getElementById('panel');
    p.innerHTML = state.sel && byId[state.sel] ? detail(byId[state.sel]) : overview();
    p.querySelectorAll('[data-goto]').forEach(function (b) { b.addEventListener('click', function (ev) { ev.stopPropagation(); select(b.getAttribute('data-goto')); }); });
    p.querySelectorAll('[data-walk]').forEach(function (b) { b.addEventListener('click', function () { window.parent.postMessage({ cim: 'walk', id: b.getAttribute('data-walk') }, '*'); }); });
    p.querySelectorAll('[data-clear]').forEach(function (b) { b.addEventListener('click', function () { select(null); }); });
    p.querySelectorAll('[data-risk]').forEach(function (b) { b.addEventListener('click', function () { var r = G.risks.filter(function (x) { return x.id === b.getAttribute('data-risk'); })[0]; state.riskFocus = r.id; state.sel = r.nodeId; render(); scrollToNode(r.nodeId); }); });
  }

  function scrollToNode(id) {
    var g = document.querySelector('[data-id="' + id.replace(/"/g, '\\"') + '"]');
    if (g && g.scrollIntoView) g.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  }
  function select(id) { state.sel = id; state.riskFocus = null; render(); if (id) scrollToNode(id); }
  function render() { drawGraph(); drawPanel(); }

  // ---------- controls ----------
  function setScope(s) { state.scope = s; document.getElementById('scope-direct').setAttribute('aria-pressed', s === 'direct'); document.getElementById('scope-chain').setAttribute('aria-pressed', s === 'chain'); render(); }
  document.getElementById('scope-direct').onclick = function () { setScope('direct'); };
  document.getElementById('scope-chain').onclick = function () { setScope('chain'); };
  document.getElementById('opt-tests').onchange = function (e) { state.tests = e.target.checked; render(); };
  document.getElementById('opt-deps').onchange = function (e) { state.deps = e.target.checked; render(); };
  document.getElementById('q').oninput = function (e) { state.q = e.target.value; drawGraph(); };
  document.getElementById('canvas').addEventListener('click', function () { if (state.sel) select(null); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && state.sel) select(null); });
  render();
})();
</script>
</body>
</html>
